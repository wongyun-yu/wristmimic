<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WristMimic</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      padding: 2rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0e0e10; color: #f2f2f2; }
      .sub { color: #9aa0a6; }
    }
    .wrap { text-align: center; max-width: 40rem; }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2rem, 6vw, 3.25rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .sub {
      margin: 0;
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      color: #6b7280;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>WristMimic</h1>
    <p class="sub">Project page coming soon.</p>
  </main>
</body>
</html>
